<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ITC</title>

    <link rel="stylesheet" href="public/css/login.css">
</head>

<body>

    <video autoplay muted loop playsinline class="bg-video">
        <source src="Icones_Fotos/clouds.mp4" type="video/mp4">

    </video>

    <div class="login-container">

        <!-- IMAGEM ITC -->
        <div class="login-image">



            <img src="public/css/imagens/image.png" alt="ITC" class="overlay-logo">

        </div>


        <!-- FORMULÁRIO -->
        <div class="login-form-area">

            <div class="login-content">

                <!-- LOGO -->
                <div class="logo-area">

                    <img src="public/css/imagens/LOGO_ITC.png" alt="Logo">

                    <h1>Bem-vindo ao HelpDesk do ITC </h1>

                    <p>Acesse a Plataforma</p>

                </div>


                <form method="POST" action="Login.php">



                    <!-- EMAIL -->
                    <div class="form-group">

                        <label>E-mail</label>

                        <div class="input-container">

                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-mail-icon lucide-mail">
                                    <path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" />
                                    <rect x="2" y="4" width="20" height="16" rx="2" />
                                </svg>
                            </div>

                            <input type="email" name="email" required placeholder="Joao@gmail.com">

                        </div>

                    </div>


                    <!-- SENHA -->
                    <div class="form-group">

                        <label>Senha</label>

                        <div class="input-container">

                            <div class="input-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-lock-keyhole-icon lucide-lock-keyhole">
                                    <circle cx="12" cy="16" r="1" />
                                    <rect x="3" y="10" width="18" height="12" rx="2" />
                                    <path d="M7 10V7a5 5 0 0 1 10 0v3" />
                                </svg>
                            </div>

                            <input type="password" name="password" id="password" required placeholder="••••••••">

                            <!-- ÍCONE DO OLHO -->
                            <div class="toggle-password" onclick="togglePassword()">
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                            </div>

                        </div>

                    </div>

                    <!-- OPÇÕES -->
                    <div class="login-options">

                        <label class="remember">

                            <input type="checkbox" name="remember">

                            Lembrar de mim

                        </label>


                        <a href="esqueciSenha.html">
                            Esqueceu a senha?
                        </a>

                    </div>


                    <!-- CRIAR CONTA -->
                    <div class="create-account-area">

                        <a href="Registo.html" class="create-account">
                            Criar Conta
                        </a>

                    </div>


                    <!-- BOTÃO -->
                    <button type="submit" class="login-button">
                        Entrar no Painel
                    </button>

                </form>

            </div>

        </div>

    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
            }
        }
    </script>

</body>

</html>
